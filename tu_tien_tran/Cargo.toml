[package]
name = "tu_tien_tran"
version = "0.1.0"
edition = "2024"

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["simd", "std"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_SystemServices"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
